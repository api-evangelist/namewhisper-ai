deviations:
- field: protocolVersion
  observed: 0.3.0
  note: Declares A2A 0.3.0 rather than 1.0.0. A version statement, not a shape failure - recorded, not penalised.
- field: supportedInterfaces + additionalInterfaces
  observed: 'both present; supportedInterfaces[0] carries url, transport, serviceUrl, transportProtocol, protocolBinding and protocolVersion all at once'
  note: >-
    The card hedges across schema generations: additionalInterfaces[].transport is the 0.3 shape, supportedInterfaces[]
    .protocolBinding is the 1.0 shape, and the single interface object repeats the same JSONRPC binding under four
    different property names so any reader finds one it recognises. Harmless, and arguably deliberate compatibility.
- field: provider_registryListing
  observed: ai.namewhisper/ens-tools
  note: A non-standard top-level key naming the MCP Registry listing. Not part of any A2A schema; ignored by validators.
- field: documentationUrl
  observed: https://namewhisper.ai/llms-full.txt
  note: Points at the agent-readable full reference rather than a human docs page (which is https://namewhisper.ai/docs). Valid, and arguably the right choice for an agent card.
- field: response shape
  observed: message/send returned kind "message", not a Task
  note: Permitted by A2A 0.3 (a synchronous reply may be a Message); tasks/get is unimplemented, so there is no task lifecycle to query.
conformance:
