note: >-
  There are no subscription tiers, no signup and no API key: every one of the 44 tools is free to call today
  ("All 44 tools become available with no API key"). The commercial model is (a) an on-chain interface fee on
  the transactions the service builds, published as a schedule in /docs and /terms with the collecting contracts
  named in security.txt, and (b) two agent-payment rails, x402 and MPP, that are wired but dormant - the fee
  switch is off, every tool's currentPrice is 0 and GET /api's x402 challenge asks for maxAmountRequired "0".
  /pricing returns 404; the fee schedule at /guide#fees is the closest thing to a pricing page.
