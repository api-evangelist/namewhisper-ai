aid: namewhisper-ai
name: NameWhisper
description: >-
  Name Whisper is an ENS (Ethereum Name Service) intelligence layer built for AI agents: natural-language search
  across 3.5M indexed .eth names, three-track valuation, live market data, wallet portfolios, and non-custodial
  transaction building for registration, renewal, Seaport listings and offers, resolver records, NameWrapper
  operations and ERC-8004 / ENSIP-25 agent identity. Everything is exposed as a public, anonymous remote MCP
  server at https://namewhisper.ai/mcp (44 tools, streamable-http, on the MCP Registry as ai.namewhisper/ens-tools)
  and an A2A 0.3.0 agent at https://namewhisper.ai/a2a, described by an agent card, an MCP server card, RFC 8414 /
  9728 auth metadata, an RFC 9727 api-catalog, an llms.txt and provider-published Agent Skills. Identity is opt-in
  ERC-8128 signed requests; x402 and MPP payments are wired but dormant. The service never holds keys - every
  mutating tool returns unsigned calldata for the caller's wallet. No OpenAPI is published for the REST twins.
