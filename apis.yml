- aid: namewhisper-ai:namewhisper-a2a-agent
  name: Name Whisper A2A Agent
  description: >-
    The agent-to-agent surface: an anonymous A2A 0.3.0 JSON-RPC endpoint at https://namewhisper.ai/a2a whose agent
    card (served at both /.well-known/agent-card.json and the legacy /.well-known/agent.json) declares 44 skills
    mirroring the MCP tools one-for-one, preferredTransport JSONRPC, and no streaming, push notifications or task
    history. message/send answered a natural-language availability question live with a Message result; tasks/get
    is unimplemented. Graded conformant against A2A 1.0.0 in a2a/namewhisper-ai-a2a.yml.
  image: https://namewhisper.ai/favicon-512.png
