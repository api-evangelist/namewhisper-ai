- aid: namewhisper-ai:namewhisper-rest-api
  name: Name Whisper REST API
  description: >-
    The REST twins of the MCP tools. The docs state "All MCP tools have equivalent REST endpoints under /api/*.
    The JSON shapes are the same" and the guide says to POST JSON bodies matching the MCP tool parameter schema;
    the agents page counts "120+ REST endpoints". No path list, reference or OpenAPI is published, robots.txt
    disallows /api/ to crawlers, and GET https://namewhisper.ai/api answers an x402 402 payment-discovery body
    that points back at the MCP endpoint. Recorded as the provider describes it; there is no machine-readable
    contract for this surface and none is derived here.
  image: https://namewhisper.ai/favicon-512.png
  humanURL: https://namewhisper.ai/docs
  baseURL: https://namewhisper.ai/api
