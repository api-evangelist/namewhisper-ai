apis:
- aid: namewhisper-ai:namewhisper-mcp-server
  name: Name Whisper MCP Server
  description: >-
    Public, anonymous remote MCP server (streamable-http, session header mcp-session-id) exposing 44 tools over
    ENS names - 19 free read tools for search, valuation, market activity, expiring names, wash-trade checks,
    portfolios, agent reputation and ENS knowledge, and 25 transaction tools that build unsigned Ethereum calldata
    for registration, renewal, Seaport listings/offers/sweeps, transfers, resolver records, NameWrapper fuses and
    subnames, and ERC-8004 agent registration. tools/list answers anonymously with a full JSON Schema inputSchema
    and readOnly/destructive/idempotent annotations per tool; ERC-8128 request signing is optional; x402/MPP
    payments are dormant. Listed on the official MCP Registry as ai.namewhisper/ens-tools v1.2.0.
