  tool classifications
description: 'Recommended x-agentic-access execution contracts for Name Whisper''s 44 MCP tools. There is no OpenAPI,
  so the heuristic derive-agentic-access.py could not run; instead the action-class is read from the provider''s
  OWN per-tool annotations (readOnlyHint / destructiveHint / idempotentHint in tools/list) and the FREE / TRANSACTION
  classification in /.well-known/x402 - which is why the method is searched rather than generated. consequence is
  API Evangelist''s reading: every non-read tool returns unsigned calldata and moves nothing until a wallet signs
  it, but once signed the result is an irreversible Ethereum transaction that moves names or ETH, so the tools that
  register, renew, buy, sell, transfer, wrap or bind identities are rated physical with human-in-the-loop required
  (the wallet signature IS the human step in the provider''s own design: ''Every transaction is built for the user
  to sign in their own wallet''). Record-, resolver-, approval- and cancel-class tools are rated write. TTL ceilings
  mirror the agentic-access Spectral ruleset. A governance starting point; audience is left null to bind per deployment.
  See research/curity/agentic-governance/.'
audience: null
custody_note: 'The provider is non-custodial: the MCP server signs nothing and holds no keys (security.txt, terms,
  auth.md). The consequence ratings describe what the calldata does once the caller signs it.'
