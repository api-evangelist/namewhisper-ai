description: >-
  Name Whisper operates a public, anonymous remote MCP server at https://namewhisper.ai/mcp (streamable-http,
  session header mcp-session-id) exposing 44 tools over ENS names: search, valuation, market data, portfolio,
  and non-custodial transaction building for registration, renewal, Seaport listings/offers, records, NameWrapper
  and ERC-8004 agent identity. The server card at /.well-known/mcp.json, the MCP Registry listing
  ai.namewhisper/ens-tools (v1.2.0, 2026-07-31) and the live tools/list all agree on the endpoint and the tool
  count. tools/list answered anonymously with a full inputSchema (JSON Schema draft-07) and annotations
  (readOnlyHint / destructiveHint / idempotentHint) for every tool; the verbatim result is saved alongside as
  namewhisper-ai-mcp-tools-list.json and is the provider's machine-readable contract - no OpenAPI is published
  for the REST twins the docs say exist under /api/*.
